<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой список дел</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .input-group { margin-bottom: 20px; }
        #taskInput { padding: 8px; width: 250px; }
        #addBtn { padding: 8px 15px; cursor: pointer; }
        ul { list-style-type: none; padding: 0; }
        li { margin-bottom: 10px; padding: 5px; background: #f0f0f0; display: flex; justify-content: space-between; width: 300px; }
        .delete-btn { background: #ff4c4c; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Мой список дел</h1>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Что нужно сделать?">
        <button id="addBtn">Добавить</button>
    </div>

    <ul id="taskList"></ul>

    <p id="counter">Всего задач: 0</p>

    <script src="script5.js"></script>
</body>
</html>
