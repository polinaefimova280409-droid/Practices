<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карточка студента</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .student-card {
            background-color: white;
            width: 350px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .student-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }

        .student-card h2 {
            margin: 10px 0;
            color: #333;
        }

        .student-card p {
            margin: 5px 0;
            color: #555;
        }

        .disciplines-title {
            text-align: left;
            margin-top: 20px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        ul {
            text-align: left;
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: calc(100% - 18px);
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
        }

        .btn-change {
            background-color: #ffc107;
            color: #333;
        }

        .btn-hide {
            background-color: #dc3545;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="student-card" id="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLC5Ad7vNPUh_HvG5B9mFcVs9FDQHCOPnmpneyPREkvA&s=10" alt="Фото студента">
        
        <h2 id="student-name">Иванов Иван Иванович</h2>

        <p>Специальность: <strong>Веб-программирование</strong></p>
        <p>Курс: <strong>3</strong></p>
        
        <div class="disciplines-title">Дисциплины:</div>
        <ul id="disciplines-list">
            <li>Основы HTML и CSS</li>
            <li>JavaScript</li>
        </ul>

        <div class="controls">
            <input type="text" id="new-discipline-input" placeholder="Название дисциплины">
            <button class="btn-add" id="add-btn">Добавить дисциплину</button>
            <button class="btn-change" id="change-info-btn">Изменить информацию</button>
            <button class="btn-hide" id="hide-card-btn">Скрыть карточку</button>
        </div>
    </div>

    <script>
        const card = document.querySelector('#card');
        const studentName = document.querySelector('#student-name');
        const disciplinesList = document.querySelector('#disciplines-list');
        const inputDiscipline = document.querySelector('#new-discipline-input');
        
        const btnChangeInfo = document.querySelector('#change-info-btn');
        const btnHideCard = document.querySelector('#hide-card-btn');
        const btnAddDiscipline = document.querySelector('#add-btn');
        
        btnChangeInfo.addEventListener('click', function() {
            studentName.textContent = 'Петров Петр Петрович'; 
        });

        btnHideCard.addEventListener('click', function() {
            card.classList.add('hidden'); 
        });

        btnAddDiscipline.addEventListener('click', function() {
            const newDisciplineText = inputDiscipline.value.trim(); 

            if (newDisciplineText !== '') {
                const newLi = document.createElement('li');
                newLi.textContent = newDisciplineText;
                disciplinesList.append(newLi);
                inputDiscipline.value = '';
            }
        });
    </script>
</body>
</html>
